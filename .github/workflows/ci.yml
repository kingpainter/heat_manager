name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install homeassistant
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pinned on purpose: an unpinned ruff picks up new rules on release
      # and turns CI red without any code change. Bump deliberately.
      - name: Install ruff
        run: pip install ruff==0.17.4

      - name: Format (auto-fix)
        run: ruff format custom_components/heat_manager tests

      - name: Lint (auto-fix)
        run: ruff check --fix custom_components/heat_manager tests

      - name: Lint check (no remaining errors)
        run: ruff check custom_components/heat_manager tests

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format with ruff"
          file_pattern: "custom_components/**/*.py tests/**/*.py"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned on purpose (v0.67.3): mypy checks our calls against Home
      # Assistant's own type hints, which change between releases. HA
      # 2026.11 types its schemas with probatio instead of voluptuous; until
      # the integration moves to that, type-check against 2026.2.3.
      - name: Install dependencies
        run: pip install homeassistant==2026.2.3 mypy==2.4.1

      - name: mypy (strict)
        run: mypy custom_components/heat_manager
